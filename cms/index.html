<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arab Unity School — CMS Login</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #002244; --navy2: #003a70;
    --green: #1a5c30; --green2: #2a7d3e;
    --gold: #c8a94a; --white: #ffffff;
    --gray-500: #64748b; --gray-700: #334155;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #001830 0%, #002244 40%, #0a3d1f 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .bg-particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .bg-particles span {
    position: absolute; width: 2px; height: 2px;
    background: rgba(200,169,74,0.35); border-radius: 50%;
    animation: float linear infinite;
  }
  @keyframes float {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }
  .login-wrap { position: relative; z-index: 10; width: 100%; max-width: 440px; margin: 20px; }
  .login-card {
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px; padding: 48px 40px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.5);
  }
  .login-logo { text-align: center; margin-bottom: 32px; }
  .login-logo .shield {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, var(--gold), #e8c96a);
    border-radius: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 2rem; margin-bottom: 16px;
    box-shadow: 0 8px 28px rgba(200,169,74,0.4);
  }
  .login-logo h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.65rem; font-weight: 700; color: #fff; line-height: 1.2;
  }
  .login-logo p { font-size: 0.76rem; color: rgba(255,255,255,0.45); margin-top: 5px; letter-spacing: 0.12em; text-transform: uppercase; }
  .login-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,169,74,0.4), transparent);
    margin: 24px 0;
  }
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block; font-size: 0.74rem; font-weight: 600;
    color: rgba(255,255,255,0.55); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px;
  }
  .input-wrap { position: relative; }
  .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.3); font-size: 0.85rem; }
  .form-group input {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 13px 14px 13px 40px;
    color: #fff; font-size: 0.92rem; font-family: 'Inter', sans-serif;
    transition: border-color 0.2s, background 0.2s; outline: none;
  }
  .form-group input:focus {
    border-color: rgba(200,169,74,0.6); background: rgba(255,255,255,0.1);
  }
  .form-group input::placeholder { color: rgba(255,255,255,0.22); }
  .remember-row {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;
  }
  .remember-row label { font-size: 0.8rem; color: rgba(255,255,255,0.5); cursor: pointer; display: flex; align-items: center; gap: 7px; }
  .btn-login {
    width: 100%;
    background: linear-gradient(135deg, var(--gold), #e8c96a);
    border: none; border-radius: 10px; padding: 14px;
    font-size: 0.92rem; font-weight: 700; color: var(--navy);
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; letter-spacing: 0.04em;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(200,169,74,0.4); }
  .btn-login:active { transform: translateY(0); }
  .btn-login.loading { opacity: 0.7; pointer-events: none; }
  .error-msg {
    background: rgba(220,38,38,0.15);
    border: 1px solid rgba(220,38,38,0.3);
    border-radius: 8px; padding: 11px 14px;
    font-size: 0.82rem; color: #fca5a5; margin-bottom: 16px; display: none;
    display: flex; align-items: center; gap: 8px;
  }
  .error-msg.hidden { display: none !important; }
  .security-note {
    margin-top: 20px;
    background: rgba(200,169,74,0.07);
    border: 1px solid rgba(200,169,74,0.18);
    border-radius: 10px; padding: 12px 14px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .security-note i { color: var(--gold); font-size: 0.85rem; margin-top: 1px; flex-shrink: 0; }
  .security-note span { font-size: 0.75rem; color: rgba(255,255,255,0.45); line-height: 1.5; }
  .login-footer {
    text-align: center; margin-top: 26px;
    font-size: 0.72rem; color: rgba(255,255,255,0.25);
    line-height: 1.7;
  }
  .role-indicator {
    display: none; margin-top: 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 8px; padding: 8px 12px;
    font-size: 0.78rem; color: rgba(255,255,255,0.5);
    text-align: center;
  }
  .role-indicator.show { display: block; }
</style>
</head>
<body>

<div class="bg-particles" id="particles"></div>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="shield">🏫</div>
      <h1>Arab Unity School</h1>
      <p>Content Management System</p>
    </div>
    <div class="login-divider"></div>

    <div class="error-msg hidden" id="errorMsg">
      <i class="fas fa-exclamation-circle"></i>
      <span>Invalid username or password. Please try again.</span>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
      </div>
      <div class="remember-row">
        <label><input type="checkbox" id="remember"> Keep me signed in</label>
      </div>
      <div class="role-indicator" id="roleIndicator"></div>
      <button type="submit" class="btn-login" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Sign In to CMS
      </button>
    </form>

    <div class="security-note">
      <i class="fas fa-shield-alt"></i>
      <span>This is a secure, restricted area. Unauthorised access is prohibited. All activity is logged.</span>
    </div>

    <div class="login-footer">
      &copy; <span id="yr"></span> Arab Unity School &middot; Dubai, UAE<br>
      Secure Admin Portal &mdash; Authorised Personnel Only
    </div>
  </div>
</div>

<script>
/*
 * AUS CMS Authentication
 * Credentials are configured once via cms/setup.html
 * Stored in localStorage keys: aus_cms_setup (username→password) and aus_cms_roles (username→role info)
 * NO credentials are hardcoded in this file.
 */

// Auto-redirect if already authenticated
if (sessionStorage.getItem('ausUser')) {
  window.location.href = 'dashboard.html';
}

// Update year
document.getElementById('yr').textContent = new Date().getFullYear();

// Login form handler
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn    = document.getElementById('loginBtn');
  const err    = document.getElementById('errorMsg');
  const errTxt = err.querySelector('span');
  const u      = document.getElementById('username').value.trim().toLowerCase();
  const p      = document.getElementById('password').value;

  btn.classList.add('loading');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying…';
  err.classList.add('hidden');

  // Small UX delay
  await new Promise(r => setTimeout(r, 600));

  // Load credentials from setup
  let setupData = null;
  let rolesData = null;
  try {
    const raw = localStorage.getItem('aus_cms_setup');
    const rawR = localStorage.getItem('aus_cms_roles');
    if (raw)  setupData = JSON.parse(raw);
    if (rawR) rolesData = JSON.parse(rawR);
  } catch(e) {}

  // No setup yet — show helpful message
  if (!setupData) {
    errTxt.textContent = 'CMS not configured yet. Please visit cms/setup.html first.';
    err.classList.remove('hidden');
    btn.classList.remove('loading');
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In to CMS';
    return;
  }

  // Verify: username exists and password matches
  const authenticated = setupData.hasOwnProperty(u) && setupData[u] === p;

  if (authenticated) {
    // Build session from roles data, fallback to defaults
    const roleInfo = (rolesData && rolesData[u]) ? rolesData[u] : {
      role: 'Staff',
      color: '#64748b',
      initials: u.substring(0,2).toUpperCase(),
      name: u,
      access: 'content'
    };

    const sessionData = {
      username:  u,
      role:      roleInfo.role,
      color:     roleInfo.color,
      initials:  roleInfo.initials,
      name:      roleInfo.name,
      access:    roleInfo.access,
      loginTime: new Date().toISOString()
    };
    sessionStorage.setItem('ausUser', JSON.stringify(sessionData));

    // Remember me
    if (document.getElementById('remember').checked) {
      localStorage.setItem('aus_remember', JSON.stringify({ u, ts: Date.now() }));
    }

    btn.innerHTML = '<i class="fas fa-check"></i> Welcome, ' + roleInfo.name + '…';
    btn.style.background = 'linear-gradient(135deg,#1a5c30,#2a7d3e)';
    btn.style.color = '#fff';
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);

  } else {
    errTxt.textContent = 'Invalid username or password. Please try again.';
    err.classList.remove('hidden');
    btn.classList.remove('loading');
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In to CMS';
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
});

// Pre-fill username if "remember me" was checked
(function checkRemember() {
  const r = localStorage.getItem('aus_remember');
  if (!r) return;
  try {
    const { u, ts } = JSON.parse(r);
    if (Date.now() - ts < 7 * 24 * 60 * 60 * 1000) {
      document.getElementById('username').value = u;
    }
  } catch(e) {}
})();

// Animated background particles
const pc = document.getElementById('particles');
for (let i = 0; i < 35; i++) {
  const s = document.createElement('span');
  s.style.cssText = `left:${Math.random()*100}%;width:${Math.random()*3+1}px;height:${Math.random()*3+1}px;animation-duration:${Math.random()*18+8}s;animation-delay:${Math.random()*12}s`;
  pc.appendChild(s);
}
</script>
</body>
</html>
